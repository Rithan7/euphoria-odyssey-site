<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Euphoria</title>
  <meta name="description"
    content="All 16 events at Euphoria '26 &mdash; off-stage and on-stage. Rules, team sizes, and registration links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/events.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <div class="page-head reveal">
        <p class="meta">The full voyage</p>
        <h1>Events</h1>
        <p>Twelve off-stage trials, four on-stage performances. Open an event for full rules and to register.</p>
      </div>
    </div>

    <div class="wave-divider" aria-hidden="true">
      <svg viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,30 C150,60 350,0 600,30 C850,60 1050,0 1200,30 L1200,60 L0,60 Z" fill="rgba(201,162,39,0.10)" />
        <path d="M0,40 C150,15 350,55 600,35 C850,15 1050,55 1200,35 L1200,60 L0,60 Z" fill="rgba(122,42,42,0.14)" />
      </svg>
    </div>

    <div class="container">
      <div class="filter-bar" role="group" aria-label="Filter events by category">
        <button class="filter-btn" data-filter="all" aria-pressed="true">All 16</button>
        <button class="filter-btn" data-filter="off-stage" aria-pressed="false">Off-stage</button>
        <button class="filter-btn" data-filter="on-stage" aria-pressed="false">On-stage</button>
      </div>

      <div class="event-grid" id="eventGrid"></div>
      <p class="empty-state" id="emptyState" hidden>No events in this category.</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/events-data.js"></script>
  <script src="js/site.js"></script>
  <script>
    renderSiteHeader("events");
    renderSiteFooter();

    const grid = document.getElementById("eventGrid");
    const emptyState = document.getElementById("emptyState");
    const buttons = document.querySelectorAll(".filter-btn");

    const swordIcon = `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <g transform="rotate(45 24 24)">
      <rect x="21.5" y="4" width="5" height="22" rx="1.2" fill="#c9a227"/>
      <rect x="15" y="24" width="18" height="4.5" rx="1.2" fill="#c9a227"/>
      <rect x="20.5" y="28" width="7" height="11" rx="1.4" fill="#7a2a2a"/>
      <circle cx="24" cy="41.5" r="2.8" fill="#c9a227"/>
    </g>
  </svg>`;
    const laurelIcon = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24,10 C18,18 18,30 24,38 C30,30 30,18 24,10 Z" stroke="#c9a227" stroke-width="1.4"/>
    <g stroke="#c9a227" stroke-width="1.4">
      <path d="M22,14 Q14,16 12,22"/>
      <path d="M22,20 Q13,22 11,28"/>
      <path d="M22,26 Q14,29 13,35"/>
      <path d="M26,14 Q34,16 36,22"/>
      <path d="M26,20 Q35,22 37,28"/>
      <path d="M26,26 Q34,29 35,35"/>
    </g>
  </svg>`;

    function cardHTML(ev) {
      const isOff = ev.category === "off-stage";
      return `
      <a class="event-card" href="event.html?slug=${ev.slug}">
        <div class="thumb">
          <span class="badge">${isOff ? "Off-stage" : "On-stage"}</span>
          ${ev.image ? `<img src="${ev.image}" alt="">` : (isOff ? swordIcon : laurelIcon)}
        </div>
        <div class="body">
          <h3>${ev.name}</h3>
          ${ev.subtitle ? `<p class="event-subtitle">${ev.subtitle}</p>` : ""}
          <p class="tagline">${ev.tagline}</p>
          <div class="card-foot">
            <span>${ev.team}</span>
            <span class="arrow">View &rarr;</span>
          </div>
        </div>
      </a>
    `;
    }

    function render(filter) {
      const list = filter === "all" ? EUPHORIA_EVENTS : EUPHORIA_EVENTS.filter(e => e.category === filter);
      grid.innerHTML = list.map(cardHTML).join("");
      emptyState.hidden = list.length > 0;
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        render(btn.dataset.filter);
      });
    });

    render("all");
  </script>
</body>

</html>
